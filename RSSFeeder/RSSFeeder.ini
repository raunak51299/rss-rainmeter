; =====================================================================
; RSSFeeder.ini - manager panel
; Creates/removes per-feed block skins (RSSFeeder\Blocks\BlockN\Block.ini)
; =====================================================================

[Rainmeter]
Update=2000
AccurateText=1

[Variables]
W=240
H=536
HeadH=34

; ---- colors --------------------------------------------------------
BgColor=16,18,26,238
HeadBg=26,29,40,255
InputBg=44,50,62,255
TxtTitle=232,236,244,255
TxtDim=132,140,152,255
TxtHover=255,255,255,255
BtnBg=36,42,54,255
BtnBgHover=62,70,88,255
RowX=120,128,140,255
Accent=90,170,255,255

[MeasureManager]
Measure=Script
ScriptFile=#SKINSPATH#RSSFeeder\@Resources\Scripts\Manager.lua

[MeasureInput]
Measure=Plugin
Plugin=InputText
X=12
Y=44
W=216
H=26
SolidColor=#InputBg#
FontColor=235,238,245,255
FontFace=Segoe UI
FontSize=10
DefaultValue=https://example.com/feed.xml
Command1=[!CommandMeasure MeasureManager "AddFeed('$UserInput$')"]
OnDismissAction=[!HideMeter MeterHint][!UpdateMeter MeterHint][!Redraw]

; =====================================================================
; PANEL
; =====================================================================

[MeterPanel]
Meter=String
X=0
Y=0
W=#W#
H=#H#
SolidColor=#BgColor#
FontColor=0,0,0,1
Text=" "
FontSize=1
AntiAlias=1

[MeterHeadBg]
Meter=String
X=0
Y=0
W=#W#
H=#HeadH#
SolidColor=#HeadBg#
FontColor=0,0,0,1
Text=" "
FontSize=1
AntiAlias=1

[MeterEdge]
Meter=String
X=0
Y=0
W=3
H=#HeadH#
SolidColor=90,170,255,255
FontColor=0,0,0,1
Text=" "
FontSize=1
AntiAlias=1

[MeterTitle]
Meter=String
X=12
Y=9
W=170
H=18
FontFace=Segoe UI
FontSize=10
FontWeight=600
FontColor=#TxtTitle#
ClipString=1
AntiAlias=1
Text=RSS FEEDER

[MeterHeadClose]
Meter=String
X=(#W# - 17)
Y=8
W=16
H=18
FontFace=Segoe MDL2 Assets
FontSize=9
FontColor=#TxtDim#
AntiAlias=1
StringAlign=Center
Text=
LeftMouseUpAction=[!DeactivateConfig "#CURRENTCONFIG#"]
MouseOverAction=[!SetOption MeterHeadClose FontColor "255,120,120,255"][!UpdateMeter MeterHeadClose][!Redraw]
MouseLeaveAction=[!SetOption MeterHeadClose FontColor "#TxtDim#"][!UpdateMeter MeterHeadClose][!Redraw]

